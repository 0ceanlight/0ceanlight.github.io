<script>
  // set theme before first paint
  (function () {
    var t = null;
    try { t = localStorage.getItem('sg2-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, m = null;
    try { m = localStorage.getItem('sg2-motion'); } catch (e) {}
    if (m ? m === 'on' : !reduce) document.documentElement.classList.add('anim');
  })();
</script>
